<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Dave Calculator</h1>
      <input id="firstNumber" placeholder="First Digit" />
      <select id="operator">
        <option value="+">+</option>
        <option value="-">-</option>
        <option value="*">*</option>
        <option value="/">/</option>
        <option value="^">^</option>
      </select>
      <input id="second" placeholder="Second Digit" />
      <br>
      <button id="calculate">Calculate</button>
      <p id="result">=</p>
       <div class="home-img">
    </div>
    </div>
  <script src="script.js"></script>
  </body>
</html>
